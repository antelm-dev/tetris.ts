name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The electron-run / electron-ipc-module dependencies are installed straight
# from GitHub and built on install via their `prepare` scripts. Neither the
# libraries' builds nor tetris's build/tests need the Electron binary, so skip
# the download to keep CI fast.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
