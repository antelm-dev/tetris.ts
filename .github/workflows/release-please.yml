name: release-please

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to rebuild and upload assets for
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  HUSKY: "0"

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: >-
      ${{
        always() &&
        (needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch')
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
          - os: macos-latest
            dist: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sync Electron version for release recovery
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          release_version="${RELEASE_TAG#tetris.ts-v}"
          npm pkg set "version=${release_version}" --prefix apps/tetris

      - name: Build installers
        run: pnpm ${{ matrix.dist }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          files=(
            apps/tetris/release/*.{exe,dmg,zip,AppImage,deb,blockmap}
            apps/tetris/release/{latest,beta}*.{yml,yaml}
          )
          if ((${#files[@]} == 0)); then
            echo "No release artifacts found in apps/tetris/release/"
            ls -la apps/tetris/release/ || true
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
