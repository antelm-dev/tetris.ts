<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tetris.ts</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src __CSP_CONNECT_SRC__"
    />
  </head>

  <body>
    <div id="titlebar">
      <span id="title">tetris.ts</span>
      <!-- Auto-update widget: hidden unless there is something to report. -->
      <div id="update" hidden>
        <span id="update-text"></span>
        <button id="update-action" hidden></button>
      </div>
      <div id="window-controls">
        <button id="btn-min" title="Minimize" aria-label="Minimize">&#x2500;</button>
        <button id="btn-full" title="Fullscreen" aria-label="Fullscreen">&#x2610;</button>
        <button id="btn-close" title="Close" aria-label="Close">&#x2715;</button>
      </div>
    </div>

    <!-- Everything below the titlebar — the score HUD, controls legend, pause /
         game-over overlay and notification banner — is drawn by p5 onto the
         canvas (see src/hud/). -->
    <div id="root"></div>

    <script type="module" src="./src/main.electron.ts"></script>
  </body>
</html>
