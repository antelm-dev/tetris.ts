appId: com.adelterki.tetris
productName: tetris.ts
directories:
  output: release
  buildResources: build
# Everything is bundled by Rollup (main/preload) and Vite (renderer), so the
# packaged app ships only the built output — no node_modules.
icon: resources/icon.png
files:
  - dist-main/**
  - dist-renderer/**
  - resources/icon.png
  - package.json
  - '!node_modules/**/*'
asar: true
npmRebuild: false
win:
  target:
    - nsis
    - portable
  executableName: tetris
  artifactName: ${name}-${version}-${arch}.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.games
  executableName: tetris
  artifactName: ${name}-${version}-${arch}.${ext}
  identity: null
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Game
  executableName: tetris
  synopsis: Tetris in TypeScript on Electron
  maintainer: Adel Terki <adel.terki2@outlook.fr>
  syncDesktopName: true
  artifactName: ${name}-${version}-${arch}.${ext}
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
