<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tetris.ts</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div id="titlebar">
      <span id="title">tetris.ts</span>
      <div id="window-controls">
        <button id="btn-min" title="Minimize" aria-label="Minimize">&#x2500;</button>
        <button id="btn-full" title="Fullscreen" aria-label="Fullscreen">&#x2610;</button>
        <button id="btn-close" title="Close" aria-label="Close">&#x2715;</button>
      </div>
    </div>

    <div id="hud">
      <div><span class="hud-label">SCORE</span><span id="hud-score">0</span></div>
      <div><span class="hud-label">BEST</span><span id="hud-best">0</span></div>
    </div>

    <div id="root"></div>

    <div id="banner" hidden></div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
