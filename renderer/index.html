<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tetris.ts</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div id="titlebar">
      <span id="title">tetris.ts</span>
      <div id="window-controls">
        <button id="btn-min" title="Minimize" aria-label="Minimize">&#x2500;</button>
        <button id="btn-full" title="Fullscreen" aria-label="Fullscreen">&#x2610;</button>
        <button id="btn-close" title="Close" aria-label="Close">&#x2715;</button>
      </div>
    </div>

    <div id="hud">
      <div class="stat"><span class="hud-label">Score</span><span id="hud-score">0</span></div>
      <div class="stat"><span class="hud-label">Best</span><span id="hud-best">0</span></div>
      <div class="stat"><span class="hud-label">Level</span><span id="hud-level">1</span></div>
      <div class="stat"><span class="hud-label">Lines</span><span id="hud-lines">0</span></div>
    </div>

    <div id="root"></div>

    <div id="legend" aria-hidden="true">
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> Move</span>
      <span><kbd>&uarr;</kbd><kbd>Z</kbd> Rotate</span>
      <span><kbd>&darr;</kbd> Soft&nbsp;drop</span>
      <span><kbd>Space</kbd> Hard&nbsp;drop</span>
      <span><kbd>Shift</kbd> Hold</span>
      <span><kbd>Esc</kbd> Pause</span>
    </div>

    <!-- Center overlays: pause + game over -->
    <div id="overlay" class="overlay" hidden>
      <div id="overlay-card">
        <h1 id="overlay-title">Paused</h1>
        <p id="overlay-sub"></p>
      </div>
    </div>

    <div id="banner" hidden></div>

    <script type="module" src="./src/renderer.ts"></script>
  </body>
</html>
